textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

  height: 20px;
  border: 0;
  border-radius: var(--radius-full);

  box-shadow: none;

  left: 0;
  width: 16px;
  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {

.form-range {

  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {

  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

.btn:focus-visible,
.nav-link:focus-visible {

  outline-offset: 2px;
}

    min-height: 44px;

  }

  .form-range::-moz-range-track {
    height: 44px;
  }

    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */

  flex: none;
  margin: 0 !important;

}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      const gRow = g =&gt; `&lt;button type=&quot;button&quot; class=&quot;pa-listrow cursor-interaction&quot; data-guide=&quot;${g.id}&quot;&gt;${icon(g.icon)}&lt;div&gt;&lt;h3&gt;${g.name}&lt;/h3&gt;&lt;p&gt;${g.desc}&lt;/p&gt;&lt;/div&gt;${icon(&#x27;chevron-right&#x27;)}&lt;/button&gt;`;
      const chips = (labels, key, selected) =&gt; labels.map(label =&gt; `&lt;button type=&quot;button&quot; class=&quot;pa-chip cursor-interaction&quot; data-${key}=&quot;${label}&quot; aria-pressed=&quot;${selected===label}&quot;&gt;${label}&lt;/button&gt;`).join(&#x27;&#x27;);
      function home() {
        return `&lt;div class=&quot;pa-quickgrid&quot;&gt;${[[&#x27;pokemon&#x27;,&#x27;book-open&#x27;,&#x27;포켓몬&#x27;,&#x27;타입 · 등급별로 찾기&#x27;],[&#x27;equipment&#x27;,&#x27;layers&#x27;,&#x27;아이템/룬/칩&#x27;,&#x27;육성에 필요한 정보&#x27;],[&#x27;decks&#x27;,&#x27;layout-grid&#x27;,&#x27;인기덱&#x27;,&#x27;수집한 덱 구성 사례&#x27;],[&#x27;guides&#x27;,&#x27;compass&#x27;,&#x27;공략&#x27;,&#x27;처음부터 차근차근&#x27;]].map(([route,ico,title,sub])=&gt;`&lt;button type=&quot;button&quot; class=&quot;pa-quick cursor-interaction&quot; data-go=&quot;${route}&quot;&gt;${icon(ico)}&lt;span&gt;&lt;b&gt;${title}&lt;/b&gt;&lt;small&gt;${sub}&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
          &lt;section&gt;${sectionHead(&#x27;포켓몬 둘러보기&#x27;,&#x27;궁금한 포켓몬을 누르면 상세 정보로 이동해요.&#x27;,more(&#x27;전체 보기&#x27;,&#x27;pokemon&#x27;))}${pGrid(pokemon.slice(0,4))}&lt;/section&gt;
          &lt;section class=&quot;pa-block&quot;&gt;${sectionHead(&#x27;인기덱 소개&#x27;,&#x27;운영자가 수집한 덱을 소개합니다. 자동 인기순위가 아닙니다.&#x27;,more(&#x27;인기덱 전체 보기&#x27;,&#x27;decks&#x27;))}&lt;div class=&quot;pa-decks&quot;&gt;${decks.slice(0,2).map(dCard).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;
          &lt;div class=&quot;pa-notices&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-go=&quot;notice&quot;&gt;${icon(&#x27;megaphone&#x27;)}공지사항 · 새 아카이브 화면 미리보기&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-go=&quot;calendar&quot;&gt;${icon(&#x27;calendar-days&#x27;)}게임 일정 ${icon(&#x27;chevron-right&#x27;)}&lt;/button&gt;&lt;/div&gt;`;
      }
      function catalogue() {
        let list = pokemon.filter(p =&gt; (s.type===&#x27;전체&#x27;||p.types.includes(s.type))&amp;&amp;(s.grade===&#x27;전체&#x27;||p.grade===s.grade));
        list.sort((a,b)=&gt;s.order===&#x27;name&#x27;?a.name.localeCompare(b.name,&#x27;ko&#x27;):b.updated-a.updated);
        return `${crumbs(&#x27;포켓몬&#x27;)}${sectionHead(&#x27;포켓몬 도감&#x27;,&#x27;타입과 등급을 고르면 원하는 포켓몬만 남아요.&#x27;)}
          &lt;div class=&quot;pa-filters&quot; aria-label=&quot;타입 필터&quot;&gt;${chips([&#x27;전체&#x27;,&#x27;전기&#x27;,&#x27;불꽃&#x27;,&#x27;물&#x27;,&#x27;풀&#x27;,&#x27;고스트&#x27;,&#x27;격투&#x27;,&#x27;드래곤&#x27;,&#x27;얼음&#x27;,&#x27;노말&#x27;],&#x27;type&#x27;,s.type)}&lt;/div&gt;
          &lt;div class=&quot;pa-toolbar&quot;&gt;&lt;span class=&quot;pa-resultcount&quot; role=&quot;status&quot;&gt;포켓몬 ${list.length}마리&lt;/span&gt;&lt;div&gt;&lt;label class=&quot;pa-select&quot;&gt;등급&lt;select id=&quot;pa-grade&quot; aria-label=&quot;등급 필터&quot;&gt;${[&#x27;전체&#x27;,&#x27;SS&#x27;,&#x27;S+&#x27;,&#x27;S&#x27;].map(g=&gt;`&lt;option value=&quot;${g}&quot; ${g===s.grade?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${g===&#x27;전체&#x27;?&#x27;모든 등급&#x27;:g}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;pa-select&quot;&gt;정렬&lt;select id=&quot;pa-sort&quot; aria-label=&quot;목록 정렬&quot;&gt;&lt;option value=&quot;recent&quot; ${s.order===&#x27;recent&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;최근 수정순&lt;/option&gt;&lt;option value=&quot;name&quot; ${s.order===&#x27;name&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;이름순&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;
          ${list.length?pGrid(list):`&lt;div class=&quot;pa-empty&quot;&gt;&lt;h3&gt;이 조건에 맞는 포켓몬이 없어요.&lt;/h3&gt;&lt;p&gt;다른 타입이나 등급을 선택해 보세요.&lt;/p&gt;${btn(&#x27;필터 초기화&#x27;,&#x27;data-reset=&quot;true&quot;&#x27;)}&lt;/div&gt;`}`;
      }
      function search() {
        const ps=pokemon.filter(p=&gt;matches([p.name,p.en,...p.types,p.grade]));
        const es=equipment.filter(e=&gt;matches([e.name,e.type,e.desc]));
        const ds=decks.filter(d=&gt;matches([d.name,...d.tags]));
        const gs=guides.filter(g=&gt;matches([g.name,g.tag,g.desc]));
        const total=ps.length+es.length+ds.length+gs.length;
        return `${crumbs(&#x27;검색 결과&#x27;)}${sectionHead(s.query?`“${s.query}” 검색 결과`:&#x27;전체 자료&#x27;,&#x27;포켓몬 · 아이템 · 인기덱 · 공략을 함께 검색합니다.&#x27;)}&lt;div class=&quot;pa-toolbar&quot;&gt;&lt;span class=&quot;pa-resultcount&quot; role=&quot;status&quot;&gt;${total}개 결과&lt;/span&gt;${btn(&#x27;검색 초기화&#x27;,&#x27;data-go=&quot;home&quot;&#x27;,&#x27;pa-quiet&#x27;)}&lt;/div&gt;
          ${ps.length?`&lt;section&gt;${sectionHead(&#x27;포켓몬&#x27;,&#x27;&#x27;)}${pGrid(ps)}&lt;/section&gt;`:&#x27;&#x27;}
          ${es.length?`&lt;section class=&quot;pa-block&quot;&gt;${sectionHead(&#x27;아이템/룬/칩&#x27;,&#x27;&#x27;)}&lt;div class=&quot;pa-listrows&quot;&gt;${es.map(eRow).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`:&#x27;&#x27;}
          ${ds.length?`&lt;section class=&quot;pa-block&quot;&gt;${sectionHead(&#x27;인기덱&#x27;,&#x27;&#x27;)}&lt;div class=&quot;pa-decks&quot;&gt;${ds.map(dCard).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`:&#x27;&#x27;}
          ${gs.length?`&lt;section class=&quot;pa-block&quot;&gt;${sectionHead(&#x27;공략&#x27;,&#x27;&#x27;)}&lt;div class=&quot;pa-listrows&quot;&gt;${gs.map(gRow).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`:&#x27;&#x27;}
          ${!total?`&lt;div class=&quot;pa-empty&quot;&gt;&lt;h3&gt;검색 결과가 없어요.&lt;/h3&gt;&lt;p&gt;이름을 짧게 입력하거나 타입으로 찾아보세요.&lt;/p&gt;${btn(&#x27;전체 포켓몬 보기&#x27;,&#x27;data-go=&quot;pokemon&quot;&#x27;,&#x27;pa-primary&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}`;
      }
      function detail() {
        const p=pokemon.find(p=&gt;p.id===Number(s.selected))||pokemon[0];
        const sets=setsFor(p);
        const tabs=[[&#x27;overview&#x27;,&#x27;기본 정보&#x27;],[&#x27;skills&#x27;,&#x27;스킬 정보&#x27;],...(sets.length?[[&#x27;build&#x27;,&#x27;추천 세팅&#x27;]]:[])];
        if(!tabs.some(([id])=&gt;id===s.tab))s.tab=&#x27;overview&#x27;;
        let panel=&#x27;&#x27;;
        if(s.tab===&#x27;overview&#x27;) panel=`&lt;article class=&quot;pa-linearticle&quot;&gt;&lt;h3&gt;포켓몬 정보부터 차근차근&lt;/h3&gt;&lt;p&gt;${p.name}의 타입과 스킬을 확인하고, 등록된 추천 세팅을 참고할 수 있습니다. 활용 방식은 성격·룬·칩·아이템 구성에 따라 달라집니다.&lt;/p&gt;&lt;div class=&quot;pa-detailfacts&quot;&gt;&lt;div&gt;&lt;small&gt;타입&lt;/small&gt;&lt;b&gt;${p.types.join(&#x27; / &#x27;)}&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;정보 상태&lt;/small&gt;&lt;b&gt;화면 구성용 예시&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pa-filters&quot;&gt;${btn(&#x27;스킬 정보 보기&#x27;,&#x27;data-tab=&quot;skills&quot;&#x27;)}${sets.length?btn(&#x27;추천 세팅 &#x27;+sets.length+&#x27;개 보기&#x27;,&#x27;data-tab=&quot;build&quot;&#x27;,&#x27;pa-primary&#x27;):&#x27;&#x27;}&lt;/div&gt;&lt;/article&gt;`;
        if(s.tab===&#x27;build&#x27;) {
          const build=sets.find(x=&gt;x.id===s.setting)||sets[0];
          s.setting=build.id;
          const field=(label,id)=&gt;`&lt;div&gt;&lt;p class=&quot;pa-fieldlabel&quot;&gt;${label}&lt;/p&gt;${eRow(equipment.find(e=&gt;e.id===id))}&lt;/div&gt;`;
          panel=`${sectionHead(&#x27;추천 세팅&#x27;,&#x27;운영자의 추천안을 참고하세요. 하나의 정답이나 고정된 역할을 뜻하지 않습니다.&#x27;)}
            ${sets.length&gt;1?`&lt;div class=&quot;pa-filters&quot; aria-label=&quot;추천 세팅 선택&quot;&gt;${sets.map(x=&gt;`&lt;button type=&quot;button&quot; class=&quot;pa-chip cursor-interaction&quot; data-setting=&quot;${x.id}&quot; aria-pressed=&quot;${x.id===build.id}&quot;&gt;${x.name}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}
            &lt;article class=&quot;pa-linearticle pa-setting&quot; data-setting-card=&quot;${build.id}&quot;&gt;&lt;div class=&quot;pa-sectionhead&quot;&gt;&lt;h3&gt;${build.name}&lt;/h3&gt;${badge(&#x27;세팅 예시&#x27;)}&lt;/div&gt;&lt;p&gt;${build.note}&lt;/p&gt;&lt;div class=&quot;pa-settinggrid&quot;&gt;&lt;div&gt;&lt;p class=&quot;pa-fieldlabel&quot;&gt;성격&lt;/p&gt;&lt;div class=&quot;pa-listrow&quot;&gt;${icon(&#x27;sparkles&#x27;)}&lt;div&gt;&lt;h3&gt;${build.nature}&lt;/h3&gt;&lt;p&gt;추천 성격과 선택 이유를 기록하는 항목입니다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;${field(&#x27;룬&#x27;,build.rune)}${field(&#x27;칩&#x27;,build.chip)}${field(&#x27;아이템&#x27;,build.item)}&lt;/div&gt;&lt;p class=&quot;pa-caption&quot;&gt;성격과 장비 조합은 화면 확인용 예시이며 실제 게임 추천 자료가 아닙니다.&lt;/p&gt;&lt;/article&gt;`;
        }
        if(s.tab===&#x27;skills&#x27;) panel=`&lt;div class=&quot;pa-featuregrid&quot;&gt;${[[&#x27;기본 공격&#x27;,&#x27;공격 방식과 핵심 효과를 짧게 표시합니다.&#x27;],[&#x27;핵심 스킬&#x27;,&#x27;중요한 효과를 먼저 보여주고 상세 설명을 덧붙입니다.&#x27;],[&#x27;패시브&#x27;,&#x27;발동 조건과 조합 시 참고할 내용을 구분합니다.&#x27;]].map(([t,d])=&gt;`&lt;article class=&quot;pa-feature&quot;&gt;&lt;h3&gt;${t}&lt;/h3&gt;&lt;p&gt;${d}&lt;/p&gt;&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        const related=decks.filter(d=&gt;d.linkedPokemon.includes(p.id)&amp;&amp;[...d.team,...d.assist].includes(p.id));
        return `${back()}&lt;article class=&quot;pa-detailhero&quot;&gt;&lt;div class=&quot;pa-detailart&quot;&gt;${image(p.id,p.name,false)}&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;pa-number&quot;&gt;POKÉMON #${String(p.number||p.id).padStart(3,&#x27;0&#x27;)}&lt;/span&gt;&lt;h1&gt;${p.name}&lt;/h1&gt;&lt;div class=&quot;pa-badges&quot;&gt;${p.types.map(badge).join(&#x27;&#x27;)}${badge(p.grade)}&lt;/div&gt;&lt;p&gt;기본 정보와 스킬, 등록된 추천 세팅을 모아봅니다.&lt;/p&gt;&lt;p class=&quot;pa-caption&quot;&gt;포켓몬의 역할을 고정하지 않고 세팅별 구성을 안내합니다.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
          &lt;div class=&quot;pa-tabs&quot; aria-label=&quot;포켓몬 상세 정보&quot;&gt;${tabs.map(([id,name])=&gt;`&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-tab=&quot;${id}&quot; aria-pressed=&quot;${s.tab===id}&quot;&gt;${name}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;section class=&quot;pa-tabbody&quot; aria-label=&quot;선택한 포켓몬 정보&quot;&gt;${panel}&lt;/section&gt;
          ${related.length?`&lt;section class=&quot;pa-block&quot; data-related-decks&gt;${sectionHead(&#x27;이 포켓몬이 포함된 인기덱&#x27;,&#x27;운영자가 수집해 연결한 덱 소개입니다. 이 포켓몬의 필수 조합을 뜻하지 않습니다.&#x27;,more(&#x27;인기덱 전체 보기&#x27;,&#x27;decks&#x27;))}&lt;div class=&quot;pa-listrows&quot;&gt;${related.map(d=&gt;`&lt;button type=&quot;button&quot; class=&quot;pa-listrow cursor-interaction&quot; data-deck=&quot;${d.id}&quot;&gt;${icon(&#x27;book-open&#x27;)}&lt;div&gt;&lt;h3&gt;${d.name}&lt;/h3&gt;&lt;p&gt;인기덱 소개로 이동 · 구성 예시&lt;/p&gt;&lt;/div&gt;${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`:&#x27;&#x27;}`;
      }
      function deckDetail() {
        const d=decks.find(d=&gt;d.id===s.selected)||decks[0];
        return `${back()}${crumbs(&#x27;인기덱 소개&#x27;)}&lt;article class=&quot;pa-linearticle&quot;&gt;&lt;div class=&quot;pa-badges&quot;&gt;${d.tags.map(badge).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pa-sectionhead&quot; style=&quot;margin-top:12px&quot;&gt;&lt;div&gt;&lt;h1&gt;${d.name}&lt;/h1&gt;&lt;p&gt;${d.desc}&lt;/p&gt;&lt;/div&gt;${likeButton(d)}&lt;/div&gt;&lt;div class=&quot;pa-detailfacts&quot;&gt;&lt;div&gt;&lt;small&gt;자료 상태&lt;/small&gt;&lt;b&gt;디자인 확인용 예시&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;확인 시점&lt;/small&gt;&lt;b&gt;실제 확인일 미등록&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;출처&lt;/small&gt;&lt;b&gt;실제 출처 미등록&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pa-tabs&quot; aria-label=&quot;덱 구성 구분&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-team=&quot;team&quot; aria-pressed=&quot;${s.teamTab===&#x27;team&#x27;}&quot;&gt;메인 ${d.team.length}마리&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-team=&quot;assist&quot; aria-pressed=&quot;${s.teamTab===&#x27;assist&#x27;}&quot;&gt;어시스트 ${d.assist.length}마리&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pa-deckslots&quot;&gt;${d[s.teamTab].map(id=&gt;{const p=pokemon.find(p=&gt;p.id===id);return `&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-pokemon=&quot;${id}&quot;&gt;${image(id,&#x27;&#x27;)}&lt;span&gt;${p.name}&lt;/span&gt;&lt;/button&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p&gt;포켓몬을 선택하면 개별 정보로 이동합니다. 추천 세팅은 등록된 경우에만 볼 수 있습니다.&lt;/p&gt;&lt;/article&gt;&lt;section class=&quot;pa-block&quot;&gt;&lt;article class=&quot;pa-linearticle&quot;&gt;&lt;h2&gt;덱 소개 메모&lt;/h2&gt;&lt;p&gt;수집한 자료에서 확인한 구성과 특징을 기록하는 영역입니다. 실제 소개에서는 출처와 확인 시점을 함께 표시합니다.&lt;/p&gt;&lt;p&gt;현재 조합은 연결 방식을 보여주는 예시이며, 실제 인기나 성능을 검증한 덱이 아닙니다. 좋아요는 관심 표시이며 사용률이나 순위를 뜻하지 않습니다.&lt;/p&gt;${more(&#x27;인기덱 목록으로&#x27;,&#x27;decks&#x27;)}&lt;/article&gt;&lt;/section&gt;`;
      }
      function equipmentPage() {
        const list=equipment.filter(e=&gt;s.equipmentType===&#x27;전체&#x27;||e.type===s.equipmentType);
        return `${crumbs(&#x27;아이템/룬/칩&#x27;)}${sectionHead(&#x27;아이템/룬/칩&#x27;,&#x27;이름을 몰라도 종류를 선택해서 찾아보세요.&#x27;)}&lt;div class=&quot;pa-filters&quot; aria-label=&quot;장비 종류&quot;&gt;${chips([&#x27;전체&#x27;,&#x27;아이템&#x27;,&#x27;룬&#x27;,&#x27;칩&#x27;],&#x27;equipment-type&#x27;,s.equipmentType)}&lt;/div&gt;&lt;div class=&quot;pa-listrows&quot;&gt;${list.map(eRow).join(&#x27;&#x27;)}&lt;/div&gt;`;
      }
